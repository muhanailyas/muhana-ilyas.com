# OPTIONAL: only needed for Route B in docs/DEPLOY.md (hosting the files on Hostinger).
# If you use Cloudflare Pages (Route A, recommended), delete this file.
#
# Every push to main (including every Save in the admin panel) builds the site
# and uploads the finished files to Hostinger over FTP.
# Needs three repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Skips everything quietly until the FTP secrets exist, so Route A users see no failures.
      HAS_FTP: ${{ secrets.FTP_SERVER != '' }}
    steps:
      - if: env.HAS_FTP != 'true'
        run: echo "FTP secrets not set; skipping Hostinger upload."
      - if: env.HAS_FTP == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_FTP == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: env.HAS_FTP == 'true'
        run: npm ci
      - if: env.HAS_FTP == 'true'
        run: npm run build
      - name: Upload to Hostinger
        if: env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
