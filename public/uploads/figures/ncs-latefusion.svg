<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Explainable multimodal late-fusion pipeline for nerve conduction studies" xmlns:c2pa="http://c2pa.org/manifest"><title>Explainable multimodal late-fusion pipeline for nerve conduction studies</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6472"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca3737"/></marker></defs><rect width="1200" height="500" fill="#ffffff"/><g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><text x="40" y="52" font-size="26" fill="#032f3c" font-weight="700" text-anchor="start">Late fusion: two models, one explained prediction</text><rect x="40" y="95" width="330" height="160" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><text x="60" y="131.0" font-size="20" fill="#032f3c" font-weight="700" text-anchor="start">Electrodiagnostic data</text><text x="60" y="160.7" font-size="17" fill="#111111" font-weight="400" text-anchor="start">latency, amplitude,</text><text x="60" y="183.64999999999998" font-size="17" fill="#111111" font-weight="400" text-anchor="start">conduction velocity,</text><text x="60" y="206.6" font-size="17" fill="#111111" font-weight="400" text-anchor="start">F-wave (table)</text><rect x="40" y="285" width="330" height="175" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><text x="60" y="321.0" font-size="20" fill="#032f3c" font-weight="700" text-anchor="start">Clinical narrative text</text><text x="60" y="350.7" font-size="17" fill="#111111" font-weight="400" text-anchor="start">leakage-controlled: words</text><text x="60" y="373.65" font-size="17" fill="#111111" font-weight="400" text-anchor="start">that state or hint at the</text><text x="60" y="396.6" font-size="17" fill="#111111" font-weight="400" text-anchor="start">final diagnosis are removed</text><line x1="378" y1="175" x2="440" y2="175" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><line x1="378" y1="372" x2="440" y2="372" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><rect x="448" y="125" width="220" height="100" rx="14" fill="#ffffff" stroke="#cfdfe3" stroke-width="1.5"/><text x="468" y="161.0" font-size="20" fill="#032f3c" font-weight="700" text-anchor="start">Tabular model</text><text x="468" y="189.6" font-size="16" fill="#111111" font-weight="400" text-anchor="start">learns from the</text><text x="468" y="211.2" font-size="16" fill="#111111" font-weight="400" text-anchor="start">measurements</text><rect x="448" y="322" width="220" height="100" rx="14" fill="#ffffff" stroke="#cfdfe3" stroke-width="1.5"/><text x="468" y="358.0" font-size="20" fill="#032f3c" font-weight="700" text-anchor="start">Text model</text><text x="468" y="386.6" font-size="16" fill="#111111" font-weight="400" text-anchor="start">learns from the</text><text x="468" y="408.20000000000005" font-size="16" fill="#111111" font-weight="400" text-anchor="start">clinical text</text><line x1="676" y1="175" x2="748" y2="255" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><line x1="676" y1="372" x2="748" y2="295" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><rect x="756" y="205" width="190" height="140" rx="14" fill="#032f3c" stroke="#032f3c" stroke-width="1.5"/><text x="776" y="241.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start">Late fusion</text><text x="776" y="269.6" font-size="16" fill="#d9e6ea" font-weight="400" text-anchor="start">combine the two</text><text x="776" y="291.20000000000005" font-size="16" fill="#d9e6ea" font-weight="400" text-anchor="start">models' predicted</text><text x="776" y="312.8" font-size="16" fill="#d9e6ea" font-weight="400" text-anchor="start">probabilities</text><line x1="954" y1="275" x2="1000" y2="275" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1008" y="150" width="160" height="100" rx="14" fill="#ffffff" stroke="#cfdfe3" stroke-width="1.5"/><text x="1088" y="192.0" font-size="18" fill="#032f3c" font-weight="700" text-anchor="middle">NCS</text><text x="1088" y="216.3" font-size="18" fill="#032f3c" font-weight="700" text-anchor="middle">diagnosis</text><rect x="1008" y="290" width="160" height="140" rx="14" fill="#fbecec" stroke="#f0c4c4" stroke-width="1.5"/><text x="1088" y="322" font-size="15" fill="#111111" font-weight="400" text-anchor="middle">Explanation</text><text x="1088" y="344" font-size="15" fill="#111111" font-weight="400" text-anchor="middle">which values</text><text x="1088" y="366" font-size="15" fill="#111111" font-weight="400" text-anchor="middle">and words</text><text x="1088" y="388" font-size="15" fill="#111111" font-weight="400" text-anchor="middle">mattered</text><line x1="1088" y1="250" x2="1088" y2="290" stroke="#9aa7aa" stroke-width="2"/></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>