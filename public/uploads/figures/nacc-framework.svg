<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="NACC forecasting framework" xmlns:c2pa="http://c2pa.org/manifest"><title>NACC forecasting framework</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6472"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca3737"/></marker></defs><rect width="1200" height="520" fill="#ffffff"/><g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><text x="40" y="52" font-size="26" fill="#032f3c" font-weight="700" text-anchor="start">Forecasting the next visit, and explaining the forecast</text><rect x="40" y="90" width="300" height="380" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><text x="60" y="126.0" font-size="20" fill="#032f3c" font-weight="700" text-anchor="start">Visit t (NACC UDS)</text><text x="64" y="168" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Demographics and history</text><text x="64" y="204" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Cognitive tests</text><text x="64" y="240" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Neuropsychiatric symptoms</text><text x="64" y="276" font-size="17" fill="#111111" font-weight="400" text-anchor="start">(NPI-Q)</text><text x="64" y="312" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Daily function (FAQ)</text><text x="64" y="348" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Clinical Dementia Rating</text><text x="64" y="384" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Diagnosis and stage</text><line x1="350" y1="280" x2="400" y2="280" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><rect x="410" y="90" width="330" height="380" rx="14" fill="#032f3c" stroke="#032f3c" stroke-width="1.5"/><text x="430" y="126.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start">Models</text><text x="434" y="170" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">Multivariate machine</text><text x="434" y="194" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">learning:</text><text x="450" y="228" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">elastic net</text><text x="450" y="254" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">XGBoost</text><text x="450" y="280" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">CatBoost</text><text x="434" y="330.0" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">Temporal models:</text><text x="450" y="362" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">cross-lagged panels</text><text x="450" y="388" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">dynamic Bayesian networks</text><text x="450" y="414" font-size="17" fill="#ffffff" font-weight="700" text-anchor="start">multi-state models</text><line x1="750" y1="280" x2="800" y2="280" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><text x="810" y="112" font-size="20" fill="#032f3c" font-weight="700" text-anchor="start">Visit t + 1 forecast</text><rect x="810" y="135" width="350" height="48" rx="10" fill="#ffffff" stroke="#cfdfe3" stroke-width="1.5"/><rect x="810" y="135" width="8" height="48" rx="3" fill="#032f3c"/><text x="834" y="166" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Cognition</text><rect x="810" y="197" width="350" height="48" rx="10" fill="#ffffff" stroke="#cfdfe3" stroke-width="1.5"/><rect x="810" y="197" width="8" height="48" rx="3" fill="#2f6472"/><text x="834" y="228" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Daily function</text><rect x="810" y="259" width="350" height="48" rx="10" fill="#ffffff" stroke="#cfdfe3" stroke-width="1.5"/><rect x="810" y="259" width="8" height="48" rx="3" fill="#ca3737"/><text x="834" y="290" font-size="18" fill="#111111" font-weight="400" text-anchor="start">Neuropsychiatric symptoms</text><text x="810" y="360" font-size="20" fill="#032f3c" font-weight="700" text-anchor="start">Explanation (SHAP)</text><rect x="990" y="378" width="161" height="15" rx="3" fill="#6f97a1"/><text x="980" y="391" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="end">Prior cognition</text><rect x="990" y="402" width="119" height="15" rx="3" fill="#6f97a1"/><text x="980" y="415" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="end">Function score</text><rect x="990" y="426" width="84" height="15" rx="3" fill="#6f97a1"/><text x="980" y="439" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="end">Age</text><rect x="990" y="450" width="63" height="15" rx="3" fill="#6f97a1"/><text x="980" y="463" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="end">Sleep, mood items</text><text x="40" y="500" font-size="15" fill="#6b6b6b" font-weight="400" text-anchor="start">Features and bar lengths in the explanation panel are examples only.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>