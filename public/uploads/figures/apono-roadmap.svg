<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="APONO roadmap by tumour type" xmlns:c2pa="http://c2pa.org/manifest"><title>APONO roadmap by tumour type</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6472"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca3737"/></marker></defs><rect width="1200" height="340" fill="#ffffff"/><g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><text x="40" y="52" font-size="26" fill="#032f3c" font-weight="700" text-anchor="start">One tumour type at a time, then one combined atlas</text><line x1="70" y1="150" x2="1000" y2="150" stroke="#cfdfe3" stroke-width="4"/><circle cx="90" cy="150" r="16" fill="#032f3c" stroke="#032f3c" stroke-width="3"/><text x="90" y="200" font-size="17" fill="#111111" font-weight="700" text-anchor="middle">Meningioma</text><text x="90" y="224" font-size="14" fill="#ca3737" font-weight="400" text-anchor="middle">in progress</text><circle cx="262" cy="150" r="16" fill="#ffffff" stroke="#032f3c" stroke-width="3"/><text x="262" y="200" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">Glioma</text><text x="262" y="224" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="middle">planned</text><circle cx="434" cy="150" r="16" fill="#ffffff" stroke="#032f3c" stroke-width="3"/><text x="434" y="200" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">Pituitary</text><text x="434" y="222" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">adenoma</text><text x="434" y="246" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="middle">planned</text><circle cx="606" cy="150" r="16" fill="#ffffff" stroke="#032f3c" stroke-width="3"/><text x="606" y="200" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">Vestibular</text><text x="606" y="222" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">schwannoma</text><text x="606" y="246" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="middle">planned</text><circle cx="778" cy="150" r="16" fill="#ffffff" stroke="#032f3c" stroke-width="3"/><text x="778" y="200" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">Medulloblastoma</text><text x="778" y="224" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="middle">planned</text><circle cx="950" cy="150" r="16" fill="#ffffff" stroke="#032f3c" stroke-width="3"/><text x="950" y="200" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">Brain</text><text x="950" y="222" font-size="17" fill="#111111" font-weight="400" text-anchor="middle">metastases</text><text x="950" y="246" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="middle">planned</text><line x1="1000" y1="150" x2="1040" y2="150" stroke="#2f6472" stroke-width="2.5" marker-end="url(#ah)"/><rect x="1048" y="98" width="120" height="104" rx="14" fill="#032f3c" stroke="#032f3c" stroke-width="1.5"/><text x="1108" y="138.0" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">Combined</text><text x="1108" y="162.3" font-size="18" fill="#ffffff" font-weight="700" text-anchor="middle">atlas</text><text x="40" y="315" font-size="16" fill="#6b6b6b" font-weight="400" text-anchor="start">Each module is a systematic review and meta-analysis in its own right.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>