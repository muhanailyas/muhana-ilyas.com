<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Traffic-light guide to AI in research writing" xmlns:c2pa="http://c2pa.org/manifest"><title>Traffic-light guide to AI in research writing</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6472"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca3737"/></marker></defs><rect width="1200" height="470" fill="#ffffff"/><g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><text x="40" y="52" font-size="26" fill="#032f3c" font-weight="700" text-anchor="start">Using AI tools in research writing: a simple traffic-light guide</text><rect x="40" y="90" width="360" height="290" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><circle cx="80" cy="132" r="16" fill="#032f3c"/><text x="108" y="140" font-size="22" fill="#032f3c" font-weight="700" text-anchor="start">Usually fine</text><circle cx="70" cy="184" r="3.5" fill="#032f3c"/><text x="84" y="190" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Improving grammar and clarity</text><text x="84" y="221" font-size="17" fill="#111111" font-weight="400" text-anchor="start">of text you wrote</text><circle cx="70" cy="246" r="3.5" fill="#032f3c"/><text x="84" y="252" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Restructuring your own draft</text><circle cx="70" cy="277" r="3.5" fill="#032f3c"/><text x="84" y="283" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Brainstorming search terms</text><circle cx="70" cy="308" r="3.5" fill="#032f3c"/><text x="84" y="314" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Checking consistency of style</text><rect x="420" y="90" width="360" height="290" rx="14" fill="#fbf3e6" stroke="#ecd6b0" stroke-width="1.5"/><circle cx="460" cy="132" r="16" fill="#b7791f"/><text x="488" y="140" font-size="22" fill="#b7791f" font-weight="700" text-anchor="start">Use with care</text><circle cx="450" cy="184" r="3.5" fill="#b7791f"/><text x="464" y="190" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Summarising papers you have</text><text x="464" y="221" font-size="17" fill="#111111" font-weight="400" text-anchor="start">read yourself</text><circle cx="450" cy="246" r="3.5" fill="#b7791f"/><text x="464" y="252" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Drafting from your own notes</text><circle cx="450" cy="277" r="3.5" fill="#b7791f"/><text x="464" y="283" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Help with analysis code</text><circle cx="450" cy="308" r="3.5" fill="#b7791f"/><text x="464" y="314" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Translating your own text</text><circle cx="450" cy="339" r="3.5" fill="#b7791f"/><text x="464" y="345" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Verify every sentence and number</text><rect x="800" y="90" width="360" height="290" rx="14" fill="#fbecec" stroke="#f0c4c4" stroke-width="1.5"/><circle cx="840" cy="132" r="16" fill="#ca3737"/><text x="868" y="140" font-size="22" fill="#ca3737" font-weight="700" text-anchor="start">Do not</text><circle cx="830" cy="184" r="3.5" fill="#ca3737"/><text x="844" y="190" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Generating references</text><circle cx="830" cy="215" r="3.5" fill="#ca3737"/><text x="844" y="221" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Inventing or "filling in" data</text><circle cx="830" cy="246" r="3.5" fill="#ca3737"/><text x="844" y="252" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Uploading patient data or</text><text x="844" y="283" font-size="17" fill="#111111" font-weight="400" text-anchor="start">manuscripts you are reviewing</text><circle cx="830" cy="308" r="3.5" fill="#ca3737"/><text x="844" y="314" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Listing AI as an author</text><circle cx="830" cy="339" r="3.5" fill="#ca3737"/><text x="844" y="345" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Hiding that you used it</text><rect x="40" y="396" width="1120" height="56" rx="12" fill="#032f3c"/><text x="600" y="431" font-size="19" fill="#ffffff" font-weight="700" text-anchor="middle">Always: disclose how you used AI, and take responsibility for every word and every citation.</text></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>