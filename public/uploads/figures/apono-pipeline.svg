<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="APONO workflow: find, extract, map, pool, share"><title>APONO workflow: find, extract, map, pool, share</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6472"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ca3737"/></marker></defs><rect width="1200" height="400" fill="#ffffff"/><g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"><text x="40" y="52" font-size="26" fill="#032f3c" font-weight="700" text-anchor="start">From published studies to an open brain atlas</text><rect x="40" y="90" width="206" height="240" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><circle cx="74" cy="128" r="17" fill="#032f3c"/><text x="74" y="134" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">1</text><text x="100" y="135" font-size="21" fill="#032f3c" font-weight="700" text-anchor="start">Find studies</text><text x="60" y="182" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Systematic search</text><text x="60" y="208" font-size="17" fill="#111111" font-weight="400" text-anchor="start">and screening of</text><text x="60" y="234" font-size="17" fill="#111111" font-weight="400" text-anchor="start">adult brain tumour</text><text x="60" y="260" font-size="17" fill="#111111" font-weight="400" text-anchor="start">surgery cohorts</text><line x1="248" y1="210.0" x2="267" y2="210.0" stroke="#2f6472" stroke-width="2" marker-end="url(#ah)"/><rect x="269" y="90" width="206" height="240" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><circle cx="303" cy="128" r="17" fill="#032f3c"/><text x="303" y="134" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">2</text><text x="329" y="135" font-size="21" fill="#032f3c" font-weight="700" text-anchor="start">Extract</text><text x="289" y="182" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Tumour location,</text><text x="289" y="208" font-size="17" fill="#111111" font-weight="400" text-anchor="start">treatment, time since</text><text x="289" y="234" font-size="17" fill="#111111" font-weight="400" text-anchor="start">treatment, cognitive</text><text x="289" y="260" font-size="17" fill="#111111" font-weight="400" text-anchor="start">and psychological</text><text x="289" y="286" font-size="17" fill="#111111" font-weight="400" text-anchor="start">outcomes</text><line x1="477" y1="210.0" x2="496" y2="210.0" stroke="#2f6472" stroke-width="2" marker-end="url(#ah)"/><rect x="498" y="90" width="206" height="240" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><circle cx="532" cy="128" r="17" fill="#032f3c"/><text x="532" y="134" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">3</text><text x="558" y="135" font-size="21" fill="#032f3c" font-weight="700" text-anchor="start">Map</text><text x="518" y="182" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Tumour sites placed</text><text x="518" y="208" font-size="17" fill="#111111" font-weight="400" text-anchor="start">in MNI152 space,</text><text x="518" y="234" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Harvard-Oxford and</text><text x="518" y="260" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Schaefer-200 atlases</text><line x1="706" y1="210.0" x2="725" y2="210.0" stroke="#2f6472" stroke-width="2" marker-end="url(#ah)"/><rect x="727" y="90" width="206" height="240" rx="14" fill="#e8f0f2" stroke="#cfdfe3" stroke-width="1.5"/><circle cx="761" cy="128" r="17" fill="#032f3c"/><text x="761" y="134" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">4</text><text x="787" y="135" font-size="21" fill="#032f3c" font-weight="700" text-anchor="start">Pool</text><text x="747" y="182" font-size="17" fill="#111111" font-weight="400" text-anchor="start">Meta-analysis by</text><text x="747" y="208" font-size="17" fill="#111111" font-weight="400" text-anchor="start">hemisphere, lobe,</text><text x="747" y="234" font-size="17" fill="#111111" font-weight="400" text-anchor="start">region and voxel</text><line x1="935" y1="210.0" x2="954" y2="210.0" stroke="#2f6472" stroke-width="2" marker-end="url(#ah)"/><rect x="956" y="90" width="206" height="240" rx="14" fill="#032f3c" stroke="#032f3c" stroke-width="1.5"/><circle cx="990" cy="128" r="17" fill="#ffffff"/><text x="990" y="134" font-size="17" fill="#ffffff" font-weight="700" text-anchor="middle">5</text><text x="990" y="134" font-size="17" fill="#032f3c" font-weight="700" text-anchor="middle">5</text><text x="1016" y="135" font-size="21" fill="#ffffff" font-weight="700" text-anchor="start">Share</text><text x="976" y="182" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">Open interactive</text><text x="976" y="208" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">atlas (NiiVue),</text><text x="976" y="234" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">searchable by</text><text x="976" y="260" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">location, diagnosis</text><text x="976" y="286" font-size="17" fill="#d9e6ea" font-weight="400" text-anchor="start">and treatment</text><text x="40" y="372" font-size="16" fill="#6b6b6b" font-weight="400" text-anchor="start">Modules are built one tumour type at a time and combined into a single atlas.</text></g></svg>